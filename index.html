<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Physique Tracker</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    :root {
      --bg: #090d16;
      --card: #151c2c;
      --border: #232d42;
      --accent: #3b82f6;
      --text: #f8fafc;
      --subtext: #8ea0b8;
      --green: #10b981;
      --red: #ef4444;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
    }
    .container { max-width: 500px; margin: 0 auto; }
    
    /* NAV TABS */
    .nav { display: flex; gap: 8px; margin-bottom: 16px; }
    .nav-btn {
      flex: 1; padding: 12px; background: var(--card); border: 1px solid var(--border);
      color: var(--subtext); font-weight: 600; border-radius: 8px; cursor: pointer;
    }
    .nav-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    .card {
      background: var(--card); border: 1px solid var(--border);
      padding: 16px; border-radius: 12px; margin-bottom: 16px;
    }

    /* MINIMAL STAT LIST */
    .stat-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid var(--border);
    }
    .stat-row:last-child { border-bottom: none; }
    .stat-label { font-weight: 500; font-size: 0.95rem; }
    .stat-val { font-weight: 700; font-size: 0.95rem; color: var(--accent); }

    /* INPUTS & BUTTONS */
    input, select, button {
      width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
      box-sizing: border-box; font-size: 0.95rem;
    }
    button { font-weight: 600; cursor: pointer; border: none; }
    .btn-accent { background: var(--accent); color: #fff; }
    .btn-danger { background: rgba(239, 68, 68, 0.15); color: var(--red); border: 1px solid var(--red); }
    
    /* QUICK SHORTCUTS */
    .quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .quick-btn { background: var(--bg); border: 1px solid var(--border); color: var(--text); font-size: 0.85rem; }

    /* WORKOUT LIST */
    .day-header { font-size: 1rem; color: var(--subtext); margin: 20px 0 8px 0; font-weight: 600; }
    .workout-card { display: flex; flex-direction: column; gap: 10px; }
    .btn-group { display: flex; gap: 6px; }
    .btn-group button { flex: 1; padding: 8px; font-size: 0.8rem; }
    .btn-up { background: rgba(16, 185, 129, 0.15); color: var(--green); }
    .btn-same { background: var(--bg); border: 1px solid var(--border); }
    .btn-down { background: rgba(239, 68, 68, 0.15); color: var(--red); }
  </style>
</head>
<body>

<div class="container">
  
  <div class="nav">
    <button class="nav-btn active" onclick="switchTab('nutrition')">Nutrition</button>
    <button class="nav-btn" onclick="switchTab('workout')">Workouts</button>
  </div>

  <!-- NUTRITION TAB -->
  <div id="nutrition" class="tab-content active">
    
    <div class="card">
      <div class="stat-row">
        <span class="stat-label">Calories</span>
        <span class="stat-val"><span id="curr-cal">0</span> / 1850 kcal</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Protein</span>
        <span class="stat-val" style="color:var(--green);"><span id="curr-pro">0</span> / 155 g</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Fiber</span>
        <span class="stat-val"><span id="curr-fib">0</span> / 30 g</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Calcium</span>
        <span class="stat-val"><span id="curr-calcium">0</span> / 1300 mg</span>
      </div>

      <div class="quick-grid">
        <button class="quick-btn" onclick="quickAdd(200, 25, 0, 0)">+ Protein Shake</button>
        <button class="quick-btn" onclick="quickAdd(350, 30, 0, 200)">+ Chicken Breast</button>
      </div>

      <button class="btn-danger" style="margin-top:16px;" onclick="resetDailyMacros()">Reset Day</button>
    </div>

    <div class="card">
      <div id="reader"></div>
      <button class="btn-accent" onclick="startScanner()">Scan Barcode</button>
    </div>

    <div class="card">
      <input type="text" id="food-name" placeholder="Food Name">
      
      <div style="display:flex; gap:8px;">
        <input type="number" id="label-serving" placeholder="Serving Size (e.g. 100)">
        <select id="label-unit" style="width:80px;"><option>g</option><option>ml</option></select>
      </div>

      <div style="display:flex; gap:8px;">
        <input type="number" id="label-cal" placeholder="Calories">
        <input type="number" id="label-pro" placeholder="Protein (g)">
      </div>
      <div style="display:flex; gap:8px;">
        <input type="number" id="label-fib" placeholder="Fiber (g)">
        <input type="number" id="label-calcium" placeholder="Calcium (mg)">
      </div>

      <input type="number" id="user-eaten" placeholder="Amount Eaten">

      <button class="btn-accent" style="margin-top:12px;" onclick="addFoodLog()">Log Food</button>
    </div>

  </div>

  <!-- WORKOUT TAB -->
  <div id="workout" class="tab-content">
    <div id="workout-list"></div>
  </div>

</div>

<script>
  const defaultWorkouts = [
    { id: 'u1_1', day: 'Day 1: Upper A', name: 'Smith Machine Incline Press', defaultWt: 50 },
    { id: 'u1_2', day: 'Day 1: Upper A', name: 'Lat Pulldown Machine', defaultWt: 55 },
    { id: 'u1_3', day: 'Day 1: Upper A', name: 'Flat Dumbbell Press', defaultWt: 30 },
    { id: 'u1_4', day: 'Day 1: Upper A', name: 'Seated Cable Row', defaultWt: 50 },
    { id: 'u1_5', day: 'Day 1: Upper A', name: 'Incline Bicep Curls', defaultWt: 15 },
    { id: 'u1_6', day: 'Day 1: Upper A', name: 'Triceps Cable Rope Pushdowns', defaultWt: 25 },

    { id: 'l1_1', day: 'Day 2: Lower A', name: 'Smith Machine Squat', defaultWt: 70 },
    { id: 'l1_2', day: 'Day 2: Lower A', name: 'Leg Press Machine', defaultWt: 110 },
    { id: 'l1_3', day: 'Day 2: Lower A', name: 'Leg Extension Machine', defaultWt: 50 },
    { id: 'l1_4', day: 'Day 2: Lower A', name: 'Calf Raise Machine', defaultWt: 60 },
    { id: 'l1_5', day: 'Day 2: Lower A', name: 'Hanging Knee Raises', defaultWt: 0 },

    { id: 'u2_1', day: 'Day 3: Upper B', name: 'Seated DB Shoulder Press', defaultWt: 25 },
    { id: 'u2_2', day: 'Day 3: Upper B', name: 'Cable Chest Flyes', defaultWt: 20 },
    { id: 'u2_3', day: 'Day 3: Upper B', name: 'Single-Arm Cable Pulldowns', defaultWt: 30 },
    { id: 'u2_4', day: 'Day 3: Upper B', name: 'Dumbbell Lateral Raises', defaultWt: 12.5 },
    { id: 'u2_5', day: 'Day 3: Upper B', name: 'EZ-Bar Cable Curls', defaultWt: 30 },
    { id: 'u2_6', day: 'Day 3: Upper B', name: 'Overhead Triceps Extensions', defaultWt: 25 },

    { id: 'l2_1', day: 'Day 4: Lower B', name: 'Smith Machine RDLs', defaultWt: 60 },
    { id: 'l2_2', day: 'Day 4: Lower B', name: 'Bulgarian Split Squats', defaultWt: 20 },
    { id: 'l2_3', day: 'Day 4: Lower B', name: 'Seated Leg Curls', defaultWt: 50 },
    { id: 'l2_4', day: 'Day 4: Lower B', name: 'Smith Machine Calf Raises', defaultWt: 70 },
    { id: 'l2_5', day: 'Day 4: Lower B', name: 'Cable Crunches', defaultWt: 50 },

    { id: 'h1_1', day: 'Day 5: Arms & Delts', name: 'Dumbbell Shrugs', defaultWt: 35 },
    { id: 'h1_2', day: 'Day 5: Arms & Delts', name: 'Cable Lateral Raises', defaultWt: 10 },
    { id: 'h1_3', day: 'Day 5: Arms & Delts', name: 'Hammer Curls', defaultWt: 20 },
    { id: 'h1_4', day: 'Day 5: Arms & Delts', name: 'Triceps Dip Machine', defaultWt: 60 },
    { id: 'h1_5', day: 'Day 5: Arms & Delts', name: 'Rear Delt Fly Machine', defaultWt: 30 }
  ];

  let macros = JSON.parse(localStorage.getItem('user_macros')) || { cal: 0, pro: 0, fib: 0, calcium: 0 };
  let workoutWeights = JSON.parse(localStorage.getItem('user_workouts')) || {};

  function init() {
    updateMacroUI();
    renderWorkouts();
  }

  function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    event.target.classList.add('active');
  }

  function updateMacroUI() {
    document.getElementById('curr-cal').innerText = Math.round(macros.cal);
    document.getElementById('curr-pro').innerText = Math.round(macros.pro);
    document.getElementById('curr-fib').innerText = Math.round(macros.fib);
    document.getElementById('curr-calcium').innerText = Math.round(macros.calcium);
    localStorage.setItem('user_macros', JSON.stringify(macros));
  }

  function quickAdd(cal, pro, fib, calcium) {
    macros.cal += cal;
    macros.pro += pro;
    macros.fib += fib;
    macros.calcium += calcium;
    updateMacroUI();
  }

  function addFoodLog() {
    const serving = parseFloat(document.getElementById('label-serving').value) || 100;
    const eaten = parseFloat(document.getElementById('user-eaten').value) || 0;
    if (eaten <= 0) return alert('Enter amount eaten');

    const ratio = eaten / serving;
    macros.cal += (parseFloat(document.getElementById('label-cal').value) || 0) * ratio;
    macros.pro += (parseFloat(document.getElementById('label-pro').value) || 0) * ratio;
    macros.fib += (parseFloat(document.getElementById('label-fib').value) || 0) * ratio;
    macros.calcium += (parseFloat(document.getElementById('label-calcium').value) || 0) * ratio;

    updateMacroUI();
    document.getElementById('user-eaten').value = '';
    alert('Logged!');
  }

  function resetDailyMacros() {
    if (confirm('Reset daily numbers?')) {
      macros = { cal: 0, pro: 0, fib: 0, calcium: 0 };
      updateMacroUI();
    }
  }

  function startScanner() {
    const html5Lt = new Html5Qrcode("reader");
    html5Lt.start({ facingMode: "environment" }, { fps: 10, qrbox: 220 }, (decodedText) => {
      html5Lt.stop();
      fetchBarcodeData(decodedText);
    }).catch(err => alert("Camera permission required."));
  }

  function fetchBarcodeData(barcode) {
    fetch(`https://world.openfoodfacts.org/api/v2/product/${barcode}.json`)
      .then(res => res.json())
      .then(data => {
        if (data.status === 1) {
          const p = data.product;
          const nut = p.nutriments || {};
          document.getElementById('food-name').value = p.product_name || 'Scanned Item';
          document.getElementById('label-serving').value = 100;
          document.getElementById('label-unit').value = 'g';
          document.getElementById('label-cal').value = Math.round(nut['energy-kcal_100g'] || 0);
          document.getElementById('label-pro').value = Math.round(nut['proteins_100g'] || 0);
          document.getElementById('label-fib').value = Math.round(nut['fiber_100g'] || 0);
          document.getElementById('label-calcium').value = Math.round((nut['calcium_100g'] || 0) * 1000);
          alert(`Found: ${p.product_name || 'Item'}`);
        } else {
          alert('Barcode not found.');
        }
      });
  }

  function renderWorkouts() {
    const container = document.getElementById('workout-list');
    container.innerHTML = '';
    let currentDay = '';

    defaultWorkouts.forEach(ex => {
      if (ex.day !== currentDay) {
        currentDay = ex.day;
        const dayHeader = document.createElement('div');
        dayHeader.className = 'day-header';
        dayHeader.innerText = currentDay;
        container.appendChild(dayHeader);
      }

      const currentWeight = workoutWeights[ex.id] !== undefined ? workoutWeights[ex.id] : ex.defaultWt;

      const card = document.createElement('div');
      card.className = 'card workout-card';
      card.innerHTML = `
        <div style="display:flex; justify-content:space-between;">
          <strong>${ex.name}</strong>
          <span style="color:var(--accent); font-weight:bold;">${currentWeight} lbs</span>
        </div>
        <div class="btn-group">
          <button class="btn-up" onclick="adjustWeight('${ex.id}', 5)">+5 lbs</button>
          <button class="btn-same" onclick="adjustWeight('${ex.id}', 0)">Same</button>
          <button class="btn-down" onclick="adjustWeight('${ex.id}', -5)">-5 lbs</button>
        </div>
      `;
      container.appendChild(card);
    });
  }

  function adjustWeight(id, change) {
    const ex = defaultWorkouts.find(w => w.id === id);
    const current = workoutWeights[id] !== undefined ? workoutWeights[id] : ex.defaultWt;
    workoutWeights[id] = Math.max(0, current + change);
    localStorage.setItem('user_workouts', JSON.stringify(workoutWeights));
    renderWorkouts();
  }

  init();
</script>
</body>
</html>
