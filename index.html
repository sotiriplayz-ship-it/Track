<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Physique Command Center</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #161e2e;
      --border: #232f48;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.2);
      --green: #10b981;
      --red: #ef4444;
      --amber: #f59e0b;
      --purple: #8b5cf6;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
    }
    .container { max-width: 500px; margin: 0 auto; }
    
    /* NAV TABS */
    .nav-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab-btn {
      flex: 1; padding: 12px; background: var(--card); border: 1px solid var(--border);
      color: var(--subtext); font-weight: 700; border-radius: 10px; cursor: pointer; font-size: 0.95rem;
      transition: all 0.2s ease;
    }
    .tab-btn.active { 
      background: var(--accent); color: #fff; border-color: var(--accent); 
      box-shadow: 0 0 12px var(--accent-glow);
    }
    
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    .card {
      background: var(--card); border: 1px solid var(--border);
      padding: 16px; border-radius: 12px; margin-bottom: 16px;
    }

    /* COLOR-CODED STAT ROW */
    .stat-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 0; border-bottom: 1px solid var(--border);
    }
    .stat-row:last-child { border-bottom: none; }
    .stat-label { font-weight: 600; font-size: 0.95rem; display: flex; align-items: center; gap: 8px; }
    .stat-badge { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .stat-val { font-weight: 700; font-size: 0.95rem; }

    /* INPUTS & BUTTONS */
    label { font-size: 0.8rem; font-weight: 600; color: var(--subtext); margin-top: 8px; display: block; }
    input, select {
      width: 100%; padding: 12px; margin-top: 4px; border-radius: 8px;
      border: 1px solid var(--border); background: #0f172a; color: var(--text);
      box-sizing: border-box; font-size: 0.95rem; outline: none;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 6px var(--accent-glow); }
    
    button { 
      width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; 
      font-weight: 700; cursor: pointer; border: none; font-size: 0.95rem;
    }
    .btn-accent { background: var(--accent); color: #fff; }
    .btn-stop { background: var(--amber); color: #000; }
    .btn-danger { background: rgba(239, 68, 68, 0.15); color: var(--red); border: 1px solid var(--red); }
    
    /* EASY LOGGING PORTION CHIPS */
    .portion-chips { display: flex; gap: 6px; margin-top: 8px; }
    .portion-btn {
      flex: 1; padding: 8px; background: #0f172a; border: 1px solid var(--border);
      color: var(--subtext); border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; margin-top: 0;
    }
    .portion-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* SCANNER CONTAINER */
    #reader-box { display: none; margin-bottom: 12px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }

    /* WORKOUT STYLES */
    .day-header { 
      font-size: 0.95rem; color: var(--accent); margin: 20px 0 8px 0; 
      font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .workout-card { display: flex; flex-direction: column; gap: 8px; }
    .btn-group { display: flex; gap: 6px; margin-top: 4px; }
    .btn-group button { flex: 1; padding: 10px 4px; font-size: 0.8rem; margin-top: 0; }
    .btn-up { background: rgba(16, 185, 129, 0.15); color: var(--green); border: 1px solid var(--green); }
    .btn-same { background: rgba(59, 130, 246, 0.15); color: var(--accent); border: 1px solid var(--accent); }
    .btn-down { background: rgba(239, 68, 68, 0.15); color: var(--red); border: 1px solid var(--red); }
  </style>
</head>
<body>

<div class="container">
  
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab(event, 'nutrition')">Nutrition Log</button>
    <button class="tab-btn" onclick="switchTab(event, 'workout')">PF Workouts</button>
  </div>

  <!-- NUTRITION TAB -->
  <div id="nutrition" class="tab-content active">
    
    <div class="card">
      <div class="stat-row">
        <span class="stat-label"><span class="stat-badge" style="background:var(--accent);"></span>Calories</span>
        <span class="stat-val" style="color:var(--accent);"><span id="curr-cal">0</span> / 1850 kcal</span>
      </div>
      <div class="stat-row">
        <span class="stat-label"><span class="stat-badge" style="background:var(--green);"></span>Protein</span>
        <span class="stat-val" style="color:var(--green);"><span id="curr-pro">0</span> / 155 g</span>
      </div>
      <div class="stat-row">
        <span class="stat-label"><span class="stat-badge" style="background:var(--amber);"></span>Fiber</span>
        <span class="stat-val" style="color:var(--amber);"><span id="curr-fib">0</span> / 30 g</span>
      </div>
      <div class="stat-row">
        <span class="stat-label"><span class="stat-badge" style="background:var(--purple);"></span>Calcium</span>
        <span class="stat-val" style="color:var(--purple);"><span id="curr-calcium">0</span> / 1300 mg</span>
      </div>

      <button class="btn-danger" style="margin-top:14px;" onclick="resetDailyMacros()">Reset Day</button>
    </div>

    <!-- SCANNER CARD -->
    <div class="card">
      <div id="reader-box"><div id="reader"></div></div>
      <button id="scan-start-btn" class="btn-accent" onclick="startScanner()">Start Barcode Scanner</button>
      <button id="scan-stop-btn" class="btn-stop" style="display:none;" onclick="stopScanner()">Stop Camera</button>
    </div>

    <!-- EASY MANUAL LOGGER -->
    <div class="card">
      <label>Food Name</label>
      <input type="text" id="food-name" placeholder="e.g. Greek Yogurt">
      
      <div style="display:flex; gap:8px;">
        <div style="flex:1;">
          <label>Serving Size</label>
          <input type="number" id="label-serving" placeholder="100">
        </div>
        <div style="width:80px;">
          <label>Unit</label>
          <select id="label-unit"><option>g</option><option>ml</option></select>
        </div>
      </div>

      <div style="display:flex; gap:8px;">
        <div style="flex:1;"><label>Calories</label><input type="number" id="label-cal" placeholder="0"></div>
        <div style="flex:1;"><label>Protein (g)</label><input type="number" id="label-pro" placeholder="0"></div>
      </div>
      <div style="display:flex; gap:8px;">
        <div style="flex:1;"><label>Fiber (g)</label><input type="number" id="label-fib" placeholder="0"></div>
        <div style="flex:1;"><label>Calcium (mg)</label><input type="number" id="label-calcium" placeholder="0"></div>
      </div>

      <label>Amount Consumed</label>
      <input type="number" id="user-eaten" placeholder="e.g. 150">
      
      <!-- EASY PORTION CHIPS -->
      <div class="portion-chips">
        <button class="portion-btn" onclick="setPortion('full')">1 Serving</button>
        <button class="portion-btn" onclick="setPortion('half')">1/2 Serving</button>
        <button class="portion-btn" onclick="setPortion('double')">2 Servings</button>
      </div>

      <button class="btn-accent" style="margin-top:14px;" onclick="addFoodLog()">Log Food</button>
    </div>

  </div>

  <!-- WORKOUT TAB -->
  <div id="workout" class="tab-content">
    <div id="workout-list"></div>
  </div>

</div>

<script>
  const defaultWorkouts = [
    { id: 'u1_1', day: 'Day 1: Upper A', name: 'Smith Machine Incline Press', defaultWt: 50 },
    { id: 'u1_2', day: 'Day 1: Upper A', name: 'Lat Pulldown Machine', defaultWt: 55 },
    { id: 'u1_3', day: 'Day 1: Upper A', name: 'Flat Dumbbell Press', defaultWt: 30 },
    { id: 'u1_4', day: 'Day 1: Upper A', name: 'Seated Cable Row', defaultWt: 50 },
    { id: 'u1_5', day: 'Day 1: Upper A', name: 'Incline Bicep Curls', defaultWt: 15 },
    { id: 'u1_6', day: 'Day 1: Upper A', name: 'Triceps Cable Rope Pushdowns', defaultWt: 25 },

    { id: 'l1_1', day: 'Day 2: Lower A', name: 'Smith Machine Squat', defaultWt: 70 },
    { id: 'l1_2', day: 'Day 2: Lower A', name: 'Leg Press Machine', defaultWt: 110 },
    { id: 'l1_3', day: 'Day 2: Lower A', name: 'Leg Extension Machine', defaultWt: 50 },
    { id: 'l1_4', day: 'Day 2: Lower A', name: 'Calf Raise Machine', defaultWt: 60 },
    { id: 'l1_5', day: 'Day 2: Lower A', name: 'Hanging Knee Raises', defaultWt: 0 },

    { id: 'u2_1', day: 'Day 3: Upper B', name: 'Seated DB Shoulder Press', defaultWt: 25 },
    { id: 'u2_2', day: 'Day 3: Upper B', name: 'Cable Chest Flyes', defaultWt: 20 },
    { id: 'u2_3', day: 'Day 3: Upper B', name: 'Single-Arm Cable Pulldowns', defaultWt: 30 },
    { id: 'u2_4', day: 'Day 3: Upper B', name: 'Dumbbell Lateral Raises', defaultWt: 12.5 },
    { id: 'u2_5', day: 'Day 3: Upper B', name: 'EZ-Bar Cable Curls', defaultWt: 30 },
    { id: 'u2_6', day: 'Day 3: Upper B', name: 'Overhead Triceps Extensions', defaultWt: 25 },

    { id: 'l2_1', day: 'Day 4: Lower B', name: 'Smith Machine RDLs', defaultWt: 60 },
    { id: 'l2_2', day: 'Day 4: Lower B', name: 'Bulgarian Split Squats', defaultWt: 20 },
    { id: 'l2_3', day: 'Day 4: Lower B', name: 'Seated Leg Curls', defaultWt: 50 },
    { id: 'l2_4', day: 'Day 4: Lower B', name: 'Smith Machine Calf Raises', defaultWt: 70 },
    { id: 'l2_5', day: 'Day 4: Lower B', name: 'Cable Crunches', defaultWt: 50 },

    { id: 'h1_1', day: 'Day 5: Arms & Delts', name: 'Dumbbell Shrugs', defaultWt: 35 },
    { id: 'h1_2', day: 'Day 5: Arms & Delts', name: 'Cable Lateral Raises', defaultWt: 10 },
    { id: 'h1_3', day: 'Day 5: Arms & Delts', name: 'Hammer Curls', defaultWt: 20 },
    { id: 'h1_4', day: 'Day 5: Arms & Delts', name: 'Triceps Dip Machine', defaultWt: 60 },
    { id: 'h1_5', day: 'Day 5: Arms & Delts', name: 'Rear Delt Fly Machine', defaultWt: 30 }
  ];

  let macros = JSON.parse(localStorage.getItem('user_macros')) || { cal: 0, pro: 0, fib: 0, calcium: 0 };
  let workoutWeights = JSON.parse(localStorage.getItem('user_workouts')) || {};
  let html5QrCode = null;

  function init() {
    updateMacroUI();
    renderWorkouts();
  }

  function switchTab(evt, tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    evt.target.classList.add('active');
  }

  function updateMacroUI() {
    document.getElementById('curr-cal').innerText = Math.round(macros.cal);
    document.getElementById('curr-pro').innerText = Math.round(macros.pro);
    document.getElementById('curr-fib').innerText = Math.round(macros.fib);
    document.getElementById('curr-calcium').innerText = Math.round(macros.calcium);
    localStorage.setItem('user_macros', JSON.stringify(macros));
  }

  /* QUICK PORTION AUTO-FILL */
  function setPortion(type) {
    const serving = parseFloat(document.getElementById('label-serving').value) || 100;
    const eatenInput = document.getElementById('user-eaten');
    
    if (type === 'full') eatenInput.value = serving;
    if (type === 'half') eatenInput.value = serving / 2;
    if (type === 'double') eatenInput.value = serving * 2;
  }

  function addFoodLog() {
    const serving = parseFloat(document.getElementById('label-serving').value) || 100;
    const eaten = parseFloat(document.getElementById('user-eaten').value) || 0;
    if (eaten <= 0) return alert('Enter amount eaten');

    const ratio = eaten / serving;
    macros.cal += (parseFloat(document.getElementById('label-cal').value) || 0) * ratio;
    macros.pro += (parseFloat(document.getElementById('label-pro').value) || 0) * ratio;
    macros.fib += (parseFloat(document.getElementById('label-fib').value) || 0) * ratio;
    macros.calcium += (parseFloat(document.getElementById('label-calcium').value) || 0) * ratio;

    updateMacroUI();
    document.getElementById('user-eaten').value = '';
    alert('Logged!');
  }

  function resetDailyMacros() {
    if (confirm('Reset daily numbers?')) {
      macros = { cal: 0, pro: 0, fib: 0, calcium: 0 };
      updateMacroUI();
    }
  }

  /* SCANNER CONTROLS WITH STOP OPTION */
  function startScanner() {
    document.getElementById('reader-box').style.display = 'block';
    document.getElementById('scan-start-btn').style.display = 'none';
    document.getElementById('scan-stop-btn').style.display = 'block';

    html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      { facingMode: "environment" }, 
      { fps: 10, qrbox: 200 }, 
      (decodedText) => {
        stopScanner();
        fetchBarcodeData(decodedText);
      }
    ).catch(err => {
      alert("Camera permission required.");
      stopScanner();
    });
  }

  function stopScanner() {
    if (html5QrCode && html5QrCode.isScanning) {
      html5QrCode.stop().then(() => {
        html5QrCode.clear();
        closeScannerUI();
      }).catch(err => closeScannerUI());
    } else {
      closeScannerUI();
    }
  }

  function closeScannerUI() {
    document.getElementById('reader-box').style.display = 'none';
    document.getElementById('scan-start-btn').style.display = 'block';
    document.getElementById('scan-stop-btn').style.display = 'none';
  }

  function fetchBarcodeData(barcode) {
    fetch(`https://world.openfoodfacts.org/api/v2/product/${barcode}.json`)
      .then(res => res.json())
      .then(data => {
        if (data.status === 1) {
          const p = data.product;
          const nut = p.nutriments || {};
          document.getElementById('food-name').value = p.product_name || 'Scanned Item';
          document.getElementById('label-serving').value = 100;
          document.getElementById('label-unit').value = 'g';
          document.getElementById('label-cal').value = Math.round(nut['energy-kcal_100g'] || 0);
          document.getElementById('label-pro').value = Math.round(nut['proteins_100g'] || 0);
          document.getElementById('label-fib').value = Math.round(nut['fiber_100g'] || 0);
          document.getElementById('label-calcium').value = Math.round((nut['calcium_100g'] || 0) * 1000);
          
          // Auto-fill eaten amount to 1 full serving as default
          document.getElementById('user-eaten').value = 100;
          alert(`Found: ${p.product_name || 'Item'}`);
        } else {
          alert('Barcode not found.');
        }
      });
  }

  function renderWorkouts() {
    const container = document.getElementById('workout-list');
    container.innerHTML = '';
    let currentDay = '';

    defaultWorkouts.forEach(ex => {
      if (ex.day !== currentDay) {
        currentDay = ex.day;
        const dayHeader = document.createElement('div');
        dayHeader.className = 'day-header';
        dayHeader.innerText = currentDay;
        container.appendChild(dayHeader);
      }

      const currentWeight = workoutWeights[ex.id] !== undefined ? workoutWeights[ex.id] : ex.defaultWt;

      const card = document.createElement('div');
      card.className = 'card workout-card';
      card.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <strong>${ex.name}</strong>
          <span style="color:var(--accent); font-weight:bold; font-size:1.1rem;">${currentWeight} lbs</span>
        </div>
        <div class="btn-group">
          <button class="btn-up" onclick="adjustWeight('${ex.id}', 5)">+5 lbs</button>
          <button class="btn-same" onclick="adjustWeight('${ex.id}', 0)">Same</button>
          <button class="btn-down" onclick="adjustWeight('${ex.id}', -5)">-5 lbs</button>
        </div>
      `;
      container.appendChild(card);
    });
  }

  function adjustWeight(id, change) {
    const ex = defaultWorkouts.find(w => w.id === id);
    const current = workoutWeights[id] !== undefined ? workoutWeights[id] : ex.defaultWt;
    workoutWeights[id] = Math.max(0, current + change);
    localStorage.setItem('user_workouts', JSON.stringify(workoutWeights));
    renderWorkouts();
  }

  init();
</script>
</body>
</html>
